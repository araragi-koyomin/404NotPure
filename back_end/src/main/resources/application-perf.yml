spring:
  jpa:
    properties:
      hibernate:
        generate_statistics: true

management:
  server:
    port: 9090
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      enabled: true
    metrics:
      enabled: true

logging:
  level:
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: "OFF"
