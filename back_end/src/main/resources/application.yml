spring:
  datasource:
    url: jdbc:mysql://localhost:3306/Tomato?characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect  # ✅ 加上这行
  main:
    allow-bean-definition-overriding: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB     # 或更大
      max-request-size: 50MB # 可选：整个请求大小
  redis:
    host: localhost
    port: 6379

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT}
    accessKeyId: ${ALIYUN_OSS_ACCESS_KEY_ID}
    accessKeySecret: ${ALIYUN_OSS_ACCESS_KEY_SECRET}
    bucketName: ${ALIYUN_OSS_BUCKET_NAME}

alipay:
  app-id: ${ALIPAY_APP_ID}
  private-key: ${ALIPAY_APP_PRIVATE_KEY}
  alipay-public-key: ${ALIPAY_ALIPAY_PUBLIC_KEY}
  notify-url: ${ALIPAY_NOTIFY_URL}
  server-url: ${ALIPAY_SERVER_URL}
  return-url: ${ALIPAY_RETURN_URL}
  charset: UTF-8
  sign-type: RSA2