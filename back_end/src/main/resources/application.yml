spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:db}:${DB_PORT:3306}/${DB_NAME:Tomato}?characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect  # ✅ 加上这行
  flyway:
    enabled: true
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1
    validate-on-migrate: true
  main:
    allow-bean-definition-overriding: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB     # 或更大
      max-request-size: 50MB # 可选：整个请求大小
  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
    connect-timeout: ${REDIS_CONNECT_TIMEOUT:250ms}
    timeout: ${REDIS_COMMAND_TIMEOUT:500ms}
  data:
    redis:
      repositories:
        enabled: false

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

tomatomall:
  cache:
    product-detail:
      enabled: ${PRODUCT_DETAIL_CACHE_ENABLED:true}
      resilience:
        bypass-duration: ${PRODUCT_CACHE_FAILURE_BYPASS_DURATION:5s}
        max-concurrent-database-fallbacks: ${PRODUCT_CACHE_DB_FALLBACK_MAX_CONCURRENT:4}
        database-fallback-wait: ${PRODUCT_CACHE_DB_FALLBACK_WAIT:50ms}
        cleanup-batch-size: ${PRODUCT_CACHE_RECOVERY_CLEANUP_BATCH_SIZE:100}

management:
  endpoints:
    enabled-by-default: false

auth:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  cookie:
    secure: ${AUTH_COOKIE_SECURE:false}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}

logging:
  level:
    org.apache.http.headers: OFF
    org.apache.http.wire: OFF
    com.aliyun.oss: OFF
    sdk.biz.err: OFF

aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT}
    accessKeyId: ${ALIYUN_OSS_ACCESS_KEY_ID}
    accessKeySecret: ${ALIYUN_OSS_ACCESS_KEY_SECRET}
    bucketName: ${ALIYUN_OSS_BUCKET_NAME}

alipay:
  app-id: ${ALIPAY_APP_ID}
  seller-id: ${ALIPAY_SELLER_ID:}
  private-key: ${ALIPAY_APP_PRIVATE_KEY}
  alipay-public-key: ${ALIPAY_ALIPAY_PUBLIC_KEY}
  notify-url: ${ALIPAY_NOTIFY_URL}
  server-url: ${ALIPAY_SERVER_URL}
  return-url: ${ALIPAY_RETURN_URL}
  frontEnd-url: ${FRONTEND_URL}
  charset: UTF-8
  sign-type: RSA2

