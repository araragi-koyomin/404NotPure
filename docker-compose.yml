services:
  frontend:
    build:
      context: ./front_end
#      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./front_end:/app  # 挂载源码实时同步
      - /app/node_modules  # 避免覆盖容器内的node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_TARGET: http://backend:8080
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    depends_on:
      backend:
        condition: service_started
    networks:
      - tomato-network

  backend:
    build:
      context: ./back_end
#      target: dev
    ports:
      - "8080:8080"
    env_file:
      - ./back_end/.env
    environment:
      # 数据库配置
      - DB_HOST=db
      - DB_PORT=3306

      # Redis配置
      - REDIS_HOST=redis

      # 其他通用配置
      - TZ=Asia/Shanghai
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - tomato-network

  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    command:
      - --default-authentication-plugin=mysql_native_password  # 使用旧版认证插件
      - --ssl=0  # 完全禁用SSL
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?run Docker Compose with --env-file back_end/.env}
      MYSQL_DATABASE: ${DB_NAME:?run Docker Compose with --env-file back_end/.env}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tomato-network


  redis:
    image: redis:6-alpine
    command: redis-server
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tomato-network



volumes:
  mysql_data:
  redis_data:

networks:
  tomato-network:
    driver: bridge
